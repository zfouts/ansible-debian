---
- name: Install AppArmor
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils

- name: Make sure AppArmor is enabled
  ansible.builtin.systemd_service:
    name: apparmor
    enabled: true

- name: Disable the Ctrl-Alt-Del reboot
  ansible.builtin.systemd_service:
    name: ctrl-alt-del.target
    masked: true

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Stop and mask unneeded services
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ hardening_disabled_services }}"
  when: (item ~ '.service') in ansible_facts.services
